kind = "web"
previewPath = "/"
title = "Vôlei Performance Pro"
description = "Plataforma SaaS premium para clubes, treinadores e analistas acompanharem performance técnica, física e tática de equipes de voleibol."
version = "1.0.0"
id = "artifacts/volei-performance-pro"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20637

[services.development]
run = "pnpm --filter @workspace/volei-performance-pro run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/volei-performance-pro", "run", "build" ]
serve = "static"
publicDir = "artifacts/volei-performance-pro/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20637"
BASE_PATH = "/"
